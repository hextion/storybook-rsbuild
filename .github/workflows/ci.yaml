name: CI

on:
  pull_request:
    branches: [storybook-v7]
  push:
    branches: [storybook-v7]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: |
          yarn lint

      - name: Format
        run: |
          yarn format

      - name: Type Check
        run: |
          yarn check

      - name: Check Dependency Version
        run: |
          yarn check-dependency-version

      - name: Test
        run: |
          yarn test

      - name: Build
        run: |
          yarn build

      - name: Build sandboxes storybooks
        run: |
          yarn build:sandboxes

  ci-ok:
    needs: build
    runs-on: ubuntu-latest
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
